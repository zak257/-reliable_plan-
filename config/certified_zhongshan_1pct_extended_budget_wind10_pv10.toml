# Expanded stage, sample, Oracle-call and per-call budgets; no total time limit.
# No total planning time limit (max_seconds=0); economic gap 1%; wind/PV max 10 each.
# Independent full-year Zhongshan run; legacy files remain read-only.
system_config = "zhongshan_certified_wind10_pv10.toml"
seed = 20260910
max_designs = 3000000

[certification]
delta = 0.05
relative_gap = 0.01
# Inactive as a stopping rule when relative_gap is configured.
epsilon_cost = 1000.0
initial_samples = 8
max_samples = 16384
max_stages = 32
max_oracle_calls = 200000
max_economic_calls = 5000
max_seconds = 0.0
base_call_seconds = 30.0
max_call_seconds = 600.0
fairness_interval = 4

[solver]
time_limit = 600.0
oracle_time_limit = 30.0
mip_gap = 0.01
threads = 2
seed = 0
output_flag = false
